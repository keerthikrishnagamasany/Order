name: Feature request
description: Suggest an improvement, a new adapter, state store or detector.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that ORDER makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. If it's an extension point (rule pack, key resolver, state store, decoy, adapter), say which. See EXTENDING.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is defensive. It doesn't add exploits, attack tooling, or anything that acts against a client.
          required: true
