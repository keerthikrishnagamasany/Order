<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ORDER — agent-aware gateway framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <!-- lane strips -->
  <g opacity="0.9">
    <rect x="900" y="92" width="380" height="8" fill="#3fb950" opacity="0.28"/>
    <rect x="900" y="140" width="380" height="8" fill="#6aa6d6" opacity="0.28"/>
    <rect x="900" y="188" width="380" height="8" fill="#d29922" opacity="0.3"/>
    <rect x="900" y="236" width="380" height="8" fill="#f85149" opacity="0.3"/>
  </g>
  <text x="80" y="150" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="92" font-weight="700" letter-spacing="10" fill="#e6edf3">ORDER</text>
  <rect x="82" y="172" width="300" height="5" rx="2" fill="url(#accent)"/>
  <text x="84" y="214" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="27" font-weight="500" fill="#8b98a8">Agent-aware gateway framework. Sort bots</text>
  <text x="84" y="250" font-family="'Space Grotesk',Segoe UI,sans-serif" font-size="27" font-weight="500" fill="#8b98a8">into lanes, trap the hostile, learn from attacks.</text>
  <!-- lane legend, right -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">
    <circle cx="960" cy="96" r="7" fill="#3fb950"/><text x="978" y="103" fill="#c9d4e0">trusted</text>
    <circle cx="960" cy="144" r="7" fill="#6aa6d6"/><text x="978" y="151" fill="#c9d4e0">normal</text>
    <circle cx="960" cy="192" r="7" fill="#d29922"/><text x="978" y="199" fill="#c9d4e0">decoy</text>
    <circle cx="960" cy="240" r="7" fill="#f85149"/><text x="978" y="247" fill="#c9d4e0">blocked</text>
  </g>
</svg>
